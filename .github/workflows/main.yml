
name: Build Watafa APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'watafa-android-project-v1.8(1).zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p /tmp/watafa
          unzip -q 'watafa-android-project-v1.8(1).zip' -d /tmp/watafa
          test -f /tmp/watafa/watafa-final/settings.gradle.kts

      - name: Build APK
        working-directory: /tmp/watafa/watafa-final
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watafa-apk
          path: /tmp/watafa/watafa-final/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
